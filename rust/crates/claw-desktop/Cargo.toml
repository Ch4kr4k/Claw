[package]
name = "claw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Desktop chat app for claw"

[[bin]]
name = "claw-desktop"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["markdown", "highlighter", "tokio", "advanced", "image", "svg"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
runtime = { path = "../runtime" }
tools = { path = "../tools" }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "fs"] }

[lints]
workspace = true
