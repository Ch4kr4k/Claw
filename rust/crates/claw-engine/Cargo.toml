[package]
name = "claw-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "claw on the Infinity runtime: asynchronous, multi-threaded agent engine (adapters for claw's providers and tools)."

[dependencies]
api = { path = "../api" }
runtime = { path = "../runtime" }
tools = { path = "../tools" }
async-trait = "0.1"
futures-util = "0.3"
infinity-agent-core = "0.2"
infinity-provider-protocol = "0.2"
rap-protocol = "0.2"
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
