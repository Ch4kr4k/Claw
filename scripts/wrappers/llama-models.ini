; llama-models.ini — the models llama-gpu's router serves (llama.cpp
; --models-preset). Each section name is a model id: in claw pick it with
; `/model local/<section>` (claw strips `local/` before sending the request).
; The router loads the requested model on demand; llama-gpu runs it with
; --models-max 1, so switching unloads the other model first (the GPU has 4 GB).
; Keys are llama-server arguments without the leading dashes. Context size
; comes from llama-gpu's command line (LLAMA_CONTEXT_LENGTH), which overrides
; anything set here.
; Kept in the repo as scripts/wrappers/llama-models.ini; installed to
; ~/.config/llama-gpu/models.ini by scripts/install-wrappers.sh. After editing
; it, `systemctl --user restart llama-gpu`.
version = 1

[*]
; Unload the model after 15 idle minutes, freeing VRAM and RAM; the next
; request loads it again (a few seconds to half a minute for the big model).
sleep-idle-seconds = 900
jinja = true
flash-attn = auto
cache-type-k = q8_0
cache-type-v = q8_0
threads = 4
parallel = 1

; Default model, loaded when the server starts: CyberTiel (peculiar-ragdoll's
; Cyber-Tiel-Coder-35B-A3B), a coding-tuned, abliterated (uncensored)
; Ornith-1.5-35B-A3B, itself a Qwen3.6-35B-A3B derivative (same hybrid
; DeltaNet + attention MoE, 40 layers, 256 experts). It does not refuse
; requests, so keep claw's sandbox and permission prompts on.
; Replaced Qwen3.6-35B-A3B on 2026-10-26. Same llama-server benchmark as Qwen
; (prompts of 1.7k/6.8k/13.6k tokens, ubatch 2048, 64k context): prefill
; 124/111/101 tok/s vs Qwen's 122/109/99, decode 23/21/20 vs 22/21/20, 3181 MiB
; VRAM for both. It thinks far less: a small coding task took 150 tokens/10 s
; vs Qwen's 9176 tokens/444 s, both passing the task's tests.
; Placement: every layer on the GPU, all experts in RAM (n-cpu-moe 40).
; The file is the UD-Q4_K_XL with its GPU-side Q8_0 matrices requantized to
; Q6_K using the model's own imatrix (experts byte-identical; 1602 vs 2039 MiB
; on the GPU). The original also runs at ubatch 2048 at the same speed, but
; leaves only ~75 MiB of VRAM free (3641 MiB used).
; Sampling: the model card's agentic-coding settings, plus the presence-penalty
; kept from Qwen3.6 (at 0 that model got stuck restating the same thoughts).
; Vision: the model card's mmproj (Ornith's own), run on the CPU
; (no-mmproj-offload) because it does not fit next to the model in 4 GB VRAM.
[cybertiel-35b-a3b]
model = ~/ws/src/cpp/nn/llama/models/Cyber-Tiel-Coder-35B-A3B-UD-Q4_K_XL-gpuQ6_K.gguf
mmproj = ~/ws/src/cpp/nn/llama/models/mmproj-Cyber-Tiel-Coder-35B-A3B-BF16.gguf
no-mmproj-offload = true
load-on-startup = true
n-gpu-layers = 99
n-cpu-moe = 40
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 1.5
repeat-penalty = 1.0
