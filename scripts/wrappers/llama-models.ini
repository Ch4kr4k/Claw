; llama-models.ini — the models llama-gpu's router serves (llama.cpp
; --models-preset). Each section name is a model id: in claw pick it with
; `/model local/<section>` (claw strips `local/` before sending the request).
; The router loads the requested model on demand; llama-gpu runs it with
; --models-max 1, so switching unloads the other model first (the GPU has 4 GB).
; Keys are llama-server arguments without the leading dashes. Context size
; comes from llama-gpu's command line (LLAMA_CONTEXT_LENGTH), which overrides
; anything set here.
; Kept in the repo as scripts/wrappers/llama-models.ini; installed to
; ~/.config/llama-gpu/models.ini by scripts/install-wrappers.sh. After editing
; it, `systemctl --user restart llama-gpu`.
version = 1

[*]
; Unload the model after 15 idle minutes, freeing VRAM and RAM; the next
; request loads it again (a few seconds to half a minute for the big model).
sleep-idle-seconds = 900
jinja = true
flash-attn = auto
cache-type-k = q8_0
cache-type-v = q8_0
threads = 4
parallel = 1

; Small uncensored model (fits the GPU almost whole, so it is fast; llama.cpp
; fits the layers itself). Qwen3.5 thinking-mode sampling.
[qwen35-4b-uncensored]
model = ~/ws/src/cpp/nn/llama/models/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
n-gpu-layers = auto
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0

; Default model, loaded when the server starts: Qwen3.6-35B-A3B (hybrid
; Gated DeltaNet + attention MoE, 40 layers, 256 experts). Picked over
; Qwen3-Coder-30B-A3B on 2026-10-17: it solved claw's agentic bug-fix task in
; half the time, and it keeps its speed at long context (llama-bench at 16k
; depth: prefill 67 vs 35 tok/s, decode 17 vs 11), since only 10 of its 40
; layers use full attention.
; Placement: every layer on the GPU, all experts in RAM (n-cpu-moe 40).
; The file is Unsloth's UD-Q4_K_XL with its GPU-side Q8_0 matrices requantized
; to Q6_K (experts byte-identical; 1602 vs 2039 MiB on the GPU), which makes
; room for ubatch 2048 and a 64k context: llama-server, 2026-10-21, prompts of
; 1.7k/6.8k/13.6k tokens 115/107/98 tok/s (was 74/96/91 with the original file,
; ubatch 1024, 32k), decode 21-24 tok/s, 3172 of 3715 MiB VRAM.
; It thinks by default; sampling follows Qwen's thinking-mode settings for
; precise coding, except presence-penalty: at 0 it got stuck restating the
; same thoughts until it hit the output-token limit (2026-10-19, a git
; commit/push turn), and Qwen recommends 0-2 against endless repetition.
; Vision: the mmproj file lets it read images (claw /image, claw desktop's
; Attach). It runs on the CPU (no-mmproj-offload): its ~0.9 GB does not fit
; next to the model in 4 GB of VRAM.
[qwen36-35b-a3b]
model = ~/ws/src/cpp/nn/llama/models/Qwen3.6-35B-A3B-UD-Q4_K_XL-gpuQ6_K.gguf
mmproj = ~/ws/src/cpp/nn/llama/models/mmproj-Qwen3.6-35B-A3B-F16.gguf
no-mmproj-offload = true
load-on-startup = true
n-gpu-layers = 99
n-cpu-moe = 40
batch-size = 2048
ubatch-size = 2048
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 1.5
repeat-penalty = 1.0
